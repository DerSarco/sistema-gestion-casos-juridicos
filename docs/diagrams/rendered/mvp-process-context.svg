ass="entity" data-qualified-name="External.OJV" id="ent0016" data-source-line="26"><rect x="442.99" y="449.267" width="207.065" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="452.99" y="472.262" fill="#000" font-size="14" textLength="153.665">Oficina Judicial Virtual</text><text x="452.99" y="488.559" fill="#000" font-size="14" textLength="187.065">uso manual independiente</text></g><!--entity User--><g class="entity" data-qualified-name="User" id="ent0001" data-source-line="7"><ellipse cx="59.857" cy="335.767" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M59.857,343.767 L59.857,370.767 M46.857,351.767 L72.857,351.767 M59.857,370.767 L46.857,385.767 M59.857,370.767 L72.857,385.767" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="6" y="400.262" fill="#000" font-size="14" textLength="107.714">Usuario interno</text><text x="6" y="416.559" fill="#000" font-size="14" textLength="74.532">autorizado</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="31"><path d="M349.71,149.297 L349.71,219.828 L743.324,219.828 L743.324,159.297 L733.324,149.297 L349.71,149.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M733.324,149.297 L733.324,159.297 L743.324,159.297 L733.324,149.297" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="355.71" y="166.364" fill="#000" font-size="13" textLength="372.614">Perfiles: socio administrador (ACT-01), abogado (ACT-02)</text><text x="355.71" y="181.497" fill="#000" font-size="13" textLength="287.828">y asistente (ACT-03), sujetos a autorización.</text><text x="355.71" y="196.629" fill="#000" font-size="13" textLength="334.452">Datos ficticios o anonimizados durante el proyecto.</text><text x="355.71" y="211.762" fill="#000" font-size="13" textLength="369.034">Sin dashboard, reportes, exportaciones ni integraciones.</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="37"><path d="M369.7,43.297 L369.7,113.828 L723.336,113.828 L723.336,53.297 L713.336,43.297 L369.7,43.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M713.336,43.297 L713.336,53.297 L723.336,53.297 L713.336,43.297" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="375.7" y="60.364" fill="#000" font-size="13" textLength="285.111">No existe conexión, consulta automatizada,</text><text x="375.7" y="75.497" fill="#000" font-size="13" textLength="332.636">sincronización ni almacenamiento de credenciales.</text><text x="375.7" y="90.629" fill="#000" font-size="13" textLength="332.446">Los antecedentes disponibles se registran después</text><text x="375.7" y="105.762" fill="#000" font-size="13" textLength="269.807">mediante una acción manual del usuario.</text></g><!--link Client to Case--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk9" data-source-line="16" data-link-type="dependency"><path d="M638.94,332.567 C689.88,332.567 748.12,332.567 799.06,332.567" style="stroke:#181818;stroke-width:1;" fill="none" id="Client-to-Case"/><polygon points="804.06,332.567,795.06,328.567,799.06,332.567,795.06,336.567,804.06,332.567" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Case to Assign--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk10" data-source-line="17" data-link-type="dependency"><path d="M989.03,332.567 C1008.98,332.567 1024.9,332.567 1044.23,332.567" style="stroke:#181818;stroke-width:1;" fill="none" id="Case-to-Assign"/><polygon points="1049.23,332.567,1040.23,328.567,1044.23,332.567,1040.23,336.567,1049.23,332.567" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Assign to State--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk11" data-source-line="18" data-link-type="dependency"><path d="M1205.96,332.567 C1225.53